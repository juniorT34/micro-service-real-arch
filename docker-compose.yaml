version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices-network

  inventory:
    build: 
      context: ./inventory-microservice
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./inventory-microservice/.env
    depends_on:
      - redis
    networks:
      - microservices-network

  payment:
    build:
      context: ./payment-microservice
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./payment-microservice/.env
    depends_on:
      - inventory
      - redis
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  redis_data: